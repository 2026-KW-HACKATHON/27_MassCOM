name: masscom-showcase-local

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: masscom_showcase_test
      POSTGRES_USER: masscom_showcase
      POSTGRES_PASSWORD: ${SHOWCASE_LOCAL_POSTGRES_PASSWORD:?local test database password is required}
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masscom_showcase -d masscom_showcase_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    image: masscom-showcase-local-api:local
    command: ["node", "dist/postgres/migrate-command.js"]
    environment:
      DATABASE_URL: postgresql://masscom_showcase@postgres:5432/masscom_showcase_test
      PGPASSWORD: ${SHOWCASE_LOCAL_POSTGRES_PASSWORD:?local test database password is required}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  api:
    image: masscom-showcase-local-api:local
    build:
      context: ../..
      dockerfile: infra/lightsail/api.Dockerfile
    environment:
      NODE_ENV: production
      API_BIND_HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://masscom_showcase@postgres:5432/masscom_showcase_test
      PGPASSWORD: ${SHOWCASE_LOCAL_POSTGRES_PASSWORD:?local test database password is required}
      GOOGLE_OAUTH_CLIENT_IDS: ""
      ALLOW_INSECURE_DEMO_ACCOUNT: "false"
      AUTH_TRUST_CADDY_FORWARDED_FOR: "false"
      SIWE_DOMAIN: demo-api.masscom.local
      SIWE_URI: https://demo-api.masscom.local/wallet/verify
    ports:
      - "127.0.0.1:3301:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
