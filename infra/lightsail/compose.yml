name: masscom

# 컨테이너 로그는 용량 기준으로 순환한다(Issue #253, D-059): 컨테이너마다 10 MB 파일 3개, 곧 최대 30 MB이고 차면 가장 오래된 조각부터 사라진다.
# 시간 기준 삭제는 아니다. 요청별 접속 기록(access log)은 Caddy 설정에 없어 남기지 않고, 남는 것은 시작·오류·인증서 관리 메시지다.
# 컨테이너를 다시 만들 때 적용되고 그 컨테이너의 로그도 함께 사라진다. 일회성 `migrate`는 `run --rm`으로 지워지므로 넣지 않는다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.10-alpine
    # 오류 로그에 오류가 난 행의 값(DETAIL)과 실패한 SQL 문이 남지 않게 한다(Issue #253, D-059). 이미 떠 있는 컨테이너는 다시 만들어야 적용된다.
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_DB: masscom
      POSTGRES_USER: masscom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masscom -d masscom"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  migrate:
    image: masscom-api:${MASSCOM_IMAGE_TAG:-local}
    command: ["node", "dist/postgres/migrate-command.js"]
    environment:
      DATABASE_URL: postgresql://masscom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/masscom
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  api:
    image: masscom-api:${MASSCOM_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/lightsail/api.Dockerfile
    environment:
      NODE_ENV: production
      API_BIND_HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://masscom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/masscom
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:?GOOGLE_OAUTH_CLIENT_IDS is required}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET:-}
      GOOGLE_WEB_REDIRECT_URI: ${GOOGLE_WEB_REDIRECT_URI:-}
      GOOGLE_WEB_WWW_ENABLED: ${GOOGLE_WEB_WWW_ENABLED:-false}
      SIWE_DOMAIN: ${MASSCOM_API_DOMAIN:-api.masscom.kr}
      SIWE_URI: https://${MASSCOM_API_DOMAIN:-api.masscom.kr}/wallet/verify
      WALLET_CHAIN_ID: "84532"
      ACCOUNT_DELETION_HMAC_SECRET: ${ACCOUNT_DELETION_HMAC_SECRET:?ACCOUNT_DELETION_HMAC_SECRET is required}
      ACCOUNT_DELETION_POLICY_VERSION: account-deletion-v1
      MERCHANT_REFERENCE_HMAC_SECRET: ${MERCHANT_REFERENCE_HMAC_SECRET:?MERCHANT_REFERENCE_HMAC_SECRET is required}
      NFT_MINT_CONSENT_VERSION: nft-mint-v2
      # 발행 서버·메인넷 승인 전까지 운영은 권리만 기록하고 고객 앱·웹에 "발행 준비 중"을 보인다(D-054). 런타임 값으로 바꿀 수 없게
      # 고정하고, LIVE로 바꾸는 것은 go-live 전제 조건(권리 기한 연장 migration 뒤)을 거친 별도 변경으로만 한다. 시연 compose는 넘기지 않는다.
      NFT_MINTING_MODE: PREPARING
      AUTH_SESSION_TTL_MS: "2592000000"
      GOOGLE_JWKS_MAX_STALE_MS: "86400000"
      AUTH_SESSION_CLEANUP_BATCH_SIZE: "100"
      AUTH_LOGIN_RATE_LIMIT_MAX: "60"
      AUTH_LOGIN_RATE_LIMIT_WINDOW_MS: "60000"
      AUTH_TRUST_CADDY_FORWARDED_FOR: "true"
      TMAP_REST_APP_KEY: ${TMAP_REST_APP_KEY:-}
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET:-}
      NAVER_SEARCH_CLIENT_ID: ${NAVER_SEARCH_CLIENT_ID:-}
      NAVER_SEARCH_CLIENT_SECRET: ${NAVER_SEARCH_CLIENT_SECRET:-}
      ALLOW_INSECURE_DEMO_ACCOUNT: "false"
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
      # 사장님 AI 가게 그림(D-048). 키가 비어 있으면 기능이 꺼지고 나머지는 기본값을 쓴다(빈 값 = 설정 안 함).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_ART_OPENAI_BASE_URL: ${AI_ART_OPENAI_BASE_URL:-}
      AI_ART_DRAFT_MODEL: ${AI_ART_DRAFT_MODEL:-}
      AI_ART_FINAL_MODEL: ${AI_ART_FINAL_MODEL:-}
      AI_ART_MONTHLY_BUDGET_USD: ${AI_ART_MONTHLY_BUDGET_USD:-}
      AI_ART_DAILY_DRAFT_ROUNDS: ${AI_ART_DAILY_DRAFT_ROUNDS:-}
      AI_ART_DAILY_FINALS: ${AI_ART_DAILY_FINALS:-}
      AI_ART_RATE_TEXT_INPUT: ${AI_ART_RATE_TEXT_INPUT:-}
      AI_ART_RATE_IMAGE_INPUT: ${AI_ART_RATE_IMAGE_INPUT:-}
      AI_ART_RATE_IMAGE_OUTPUT: ${AI_ART_RATE_IMAGE_OUTPUT:-}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  production-web:
    image: masscom-production-web:${MASSCOM_WEB_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/lightsail/production-web.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4173"
      MASSCOM_WEB_BIND_HOST: 0.0.0.0
    expose:
      - "4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # NFT 발행 Worker(상시 실행). 평소 배포에서는 뜨지 않는다: 운영은 발행 준비 중이고(D-054) go-live 전제 조건(B-027)을
  # 거친 뒤에만 `--profile nft-live`로 켠다. 배포 스크립트는 서비스를 이름으로 지정해 올리므로 이 서비스를 건드리지 않는다.
  # 한 체인에는 서비스 민터가 하나라서 이 서비스는 항상 1개만 띄운다(복제하지 않는다).
  # 민터 keystore·비밀번호 파일은 저장소·이미지 밖의 호스트 폴더에서 읽기 전용으로 마운트한다. 폴더와 파일은 컨테이너
  # 사용자(node, uid 1000) 소유, 파일 권한 600, 폴더는 그룹·기타 쓰기 금지여야 Worker의 권한 검사를 통과한다.
  mint-worker:
    profiles:
      - nft-live
    image: masscom-worker:${MASSCOM_WORKER_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/lightsail/worker.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://masscom:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/masscom
      CHAIN_RPC_URL: ${NFT_CHAIN_RPC_URL:-}
      CHAIN_ID: ${NFT_CHAIN_ID:-}
      NFT_CONTRACT_ADDRESS: ${NFT_CONTRACT_ADDRESS:-}
      MINTER_ADDRESS: ${NFT_MINTER_ADDRESS:-}
      # 기본값을 두지 않는다. 비어 있으면 Worker가 시작을 거절한다(0부터 훑어 RPC 조회 한도를 넘기는 일을 막는다).
      CHAIN_FROM_BLOCK: ${NFT_CHAIN_FROM_BLOCK:-}
      CHAIN_CONFIRMATIONS: ${NFT_CHAIN_CONFIRMATIONS:-1}
      CHAIN_RECEIPT_TIMEOUT_MS: ${NFT_CHAIN_RECEIPT_TIMEOUT_MS:-600000}
      MINTER_MIN_BALANCE_WEI: ${NFT_MINTER_MIN_BALANCE_WEI:-0}
      # 확정 때 고정하는 공개 메타데이터의 출처라 환경 파일로 바꿀 수 없게 운영 값으로 고정한다(Issue #254).
      NFT_METADATA_ORIGIN: https://masscom.kr
      # Worker가 호스트 이름과 pid를 뒤에 붙여 임대 소유자(lease_owner)를 컨테이너마다 다르게 만든다.
      WORKER_ID: masscom-mint-worker
      WORKER_IDLE_POLL_MS: ${NFT_WORKER_IDLE_POLL_MS:-3000}
      WORKER_HEARTBEAT_FILE: /tmp/mint-worker.heartbeat
      MINTER_KEYSTORE_PATH: /run/minter/keystore.json
      MINTER_KEYSTORE_PASSWORD_FILE: /run/minter/password
    # 필수 변수(:?)로 두면 이 프로파일을 켜지 않은 평소 배포의 compose 검사까지 깨지므로 기본 경로를 둔다.
    # 호스트 폴더가 없으면 만들지 않고 시작을 거절한다(root 소유 빈 폴더가 생겨 엉뚱하게 도는 것을 막는다).
    volumes:
      - type: bind
        source: ${NFT_MINTER_KEY_DIR:-/opt/masscom/minter}
        target: /run/minter
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    # 반복이 한 번 성공적으로 끝날 때마다 시각을 적는다. 3분 넘게 갱신되지 않으면 멈춘 것으로 본다.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - try{const t=Number(require('fs').readFileSync('/tmp/mint-worker.heartbeat','utf8'));process.exit(Date.now()-t<180000?0:1)}catch{process.exit(1)}
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # SIGTERM을 받으면 처리 중인 한 건을 끝내고 멈춘다. 60초는 보통의 한 건(영수증 대기 기한 30초, 마지막 RPC 요청이 걸려도 약 50초 포함)에는 충분하지만
    # 끝난다는 보장은 아니다. 못 끝내고 SIGKILL되면 임대 만료(30초)와 기록된 서명 거래 재전송으로 복구된다.
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      MASSCOM_API_DOMAIN: ${MASSCOM_API_DOMAIN:-api.masscom.kr}
      MASSCOM_WEB_DOMAIN: ${MASSCOM_WEB_DOMAIN:-masscom.kr}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      default:
      showcase_edge:
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../site/public:/srv/masscom:ro
      # 시연 웹 체험(Issue #309) 정적 번들. demo-api.masscom.kr/play/만 이 경로를 읽는다(운영 출처는 읽지 않는다).
      - ${MASSCOM_SHOWCASE_WEB_DIR:-/opt/masscom-showcase/web/current}:/srv/showcase-web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      production-web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

networks:
  showcase_edge:
    external: true
    name: masscom_showcase_edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
