name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    # 평소 11~12분이다. 시험이 끝나지 않을 때 기본 6시간을 다 쓰지 않도록 끊는다(#358).
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_DB: masscom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d masscom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: true
      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/mobile/package-lock.json
            apps/worker/package-lock.json
      - name: 저장소 비밀값 검사
        run: |
          bash scripts/check-secrets.sh
          bash tests/bootstrap/check_secrets_test.sh
      - name: 큰 파일 검사
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          # 첫 push(모두 0인 sha)나 이력에서 사라진 sha(force push)면 직전 커밋과, 그것도 없으면 빈 트리와 비교한다.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse --verify --quiet HEAD^ || git hash-object -t tree /dev/null)"
          fi
          bash scripts/check-large-files.sh "$base"
          bash tests/bootstrap/check_large_files_test.sh
      - name: 시험 파일의 CI 연결 누락 검사
        run: bash tests/ci/ci_wiring_test.sh
      - name: PR 한국어 작성 확인
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-pr-korean.sh "$PR_TITLE" "$PR_BODY"
      - name: PR 한국어 검사기 회귀 시험
        run: bash tests/bootstrap/check_pr_korean_test.sh
      - name: 병합 충돌 표시 검사
        run: |
          bash scripts/check-conflict-markers.sh
          bash tests/bootstrap/check_conflict_markers_test.sh
      - name: Verify repository contract
        run: bash tests/bootstrap/verify_bootstrap_test.sh
      - name: 운영 문서 정합 검사
        run: |
          bash tests/bootstrap/verify_operations_docs_test.sh
          bash tests/bootstrap/operations_submission_readiness_test.sh
          bash tests/bootstrap/demo_submission_readiness_test.sh
          bash tests/bootstrap/judging_submission_readiness_test.sh
      - name: Verify project portal
        run: bash tests/site/check_site_accessibility_test.sh
      - name: Verify project portal structure
        run: bash tests/site/verify_project_site_test.sh
      - name: 현재 배포 상태 일치 검사
        run: node --test tests/site/current_release_test.mjs
      - name: 이용약관·처리방침 페이지 검사
        run: node --test tests/site/legal-pages.test.mjs
      - name: 시연 웹 사실성·읽기 전용 검사
        run: node --test tests/site/verify_showcase_site_test.mjs
      - name: 웹 디자인 토큰·앱 색 정합 검사
        run: node --test tests/site/verify_design_tokens_test.mjs
      # production-recovery.test.mjs는 verify_production_web_test.mjs가 import해 함께 돈다. 여기에 또 적으면 두 번 실행된다.
      - name: 운영 웹 공개 조회·읽기 전용 경계 검사
        run: node --test tests/site/verify_production_web_test.mjs tests/site/store-go-live-admin.test.mjs tests/site/nft-metadata-admin.test.mjs tests/site/real-world-merchant.test.mjs tests/site/public-entry.test.mjs tests/site/account-deletion-flow.test.mjs tests/site/admin-funnel.test.mjs tests/site/merchant-actions-overview.test.mjs
      - name: 사진 수집품 모델·편집·도감 검사
        run: node --test tests/site/collectible-*.test.mjs
      - name: 캠페인 연장·가게 정보 수정·매장 안내문 웹 검사
        run: node --test tests/site/commercial-*.test.mjs
      - name: AWS 운영 웹 정적 번들·Caddy 경계 검사
        run: |
          node --test tests/site/build_public_site_test.mjs tests/ops/verify_aws_web_routes_test.mjs
          node scripts/verify-lightsail-web.mjs
          bash tests/ops/run_aws_web_smoke.sh
          node --test tests/ops/verify_web_session_proxy_test.mjs
          node --test tests/ops/verify_nft_metadata_proxy_test.mjs
          node --test tests/ops/install_web_oauth_runtime_test.mjs
          bash tests/ops/verify_lightsail_deployment_test.sh
          bash tests/ops/deploy_lightsail_test.sh
          bash tests/ops/deploy_lightsail_web_test.sh
          bash tests/ops/host_retention_job_test.sh
          bash tests/ops/host_backup_job_test.sh
          bash tests/ops/uptime_probe_test.sh
          bash tests/ops/db_restore_drill_backup_file_test.sh
          node --test tests/ops/compose_log_rotation_test.mjs tests/ops/compose_push_token_test.mjs tests/ops/lightsail_readme_current_test.mjs
          node --test tests/ops/audit_ci_test.mjs
      - name: 시연 웹 라이트·다크 실제 브라우저 검사
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            echo 'Chrome 또는 Chromium 실행 파일을 찾지 못했습니다.' >&2
            exit 1
          fi
          CHROME_PATH="$chrome_path" node --test tests/site/verify_showcase_theme_test.mjs
      - name: 로컬 시연 API·DB 격리 설정 검사
        run: |
          node --test tests/ops/verify_showcase_local_test.mjs
          node scripts/verify-showcase-local.mjs
          bash tests/ops/qa_local_env_test.sh
      - name: 시연 호스트 격리 설정 검사
        run: |
          bash tests/ops/prepare_showcase_runtime_test.sh
          bash tests/ops/enable_ai_art_test.sh
          node --test tests/ops/fake_openai_images_faults_test.mjs
          bash -n scripts/rehearse-ai-art-container.sh
          bash -n scripts/rehearse-enable-ai-art-real-compose.sh
          node --check scripts/rehearse-ai-art-container.mjs
          node --test tests/ops/verify_showcase_host_test.mjs tests/ops/verify_showcase_edge_routes_test.mjs tests/ops/verify_showcase_caddy_override_test.mjs
          node scripts/verify-showcase-host.mjs
          node --test tests/ops/verify_showcase_edge_runtime_test.mjs
          docker run --rm -v "$PWD/infra/lightsail/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null \
            | node scripts/verify-showcase-edge-routes.mjs
      - name: 모바일 접근성 semantics 검사
        run: bash tests/mobile/check_accessibility_semantics_test.sh
      - name: 증거 수치 정합 검사
        run: bash tests/site/verify_evidence_consistency_test.sh
      - name: Verify release wallet surface check
        run: bash tests/release/check_release_wallet_surface_test.sh
      - name: Verify Base Sepolia deploy preflight
        run: bash tests/release/deploy_base_sepolia_preflight_test.sh
      - name: Verify AAB signature verdict and build flow
        run: bash tests/release/verify_aab_signature_test.sh
      - name: Verify AAB assessment provenance
        run: bash tests/release/assess_release_aab_test.sh
      - name: Verify AAB manifest reader
        run: bash tests/release/dump_aab_manifest_test.sh
      - name: Verify release Keychain signing boundary
        run: bash tests/release/verify_release_keychain_test.sh
      - name: 빌드에 들어간 API 주소 검사
        run: bash tests/release/check_embedded_api_test.sh
      - name: 시연 APK 전용 빌드 경계 검사
        run: |
          bash tests/release/verify_showcase_apk_test.sh
          bash tests/release/verify_showcase_keychain_test.sh
      - name: NFT 계약 포맷·빌드·테스트
        run: |
          ./scripts/forge.sh --version | grep -q 'forge Version: 1.8.3'
          ./scripts/forge.sh fmt --check
          ./scripts/forge.sh build
          ./scripts/forge.sh test -vvv
          ./scripts/forge.sh lint
      - name: 앱·API 의존성 설치
        run: |
          npm ci --prefix apps/api
          npm ci --prefix apps/mobile
          npm ci --prefix apps/worker
      - name: 개인정보 로그 검사
        run: |
          bash scripts/check-privacy.sh
          bash tests/bootstrap/check_privacy_test.sh
      - name: API·PostgreSQL 테스트·타입검사·빌드
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          PGPASSWORD: postgres
        run: |
          npm run db:migrate --prefix apps/api
          # 단위 시험만 커버리지를 잰다(보고용). PostgreSQL 통합 시험은 커버리지를 켜면 로컬에서 약 24분이 걸려 25분 제한에 맞지 않으므로 그대로 둔다.
          # pipefail은 tee 앞의 npm 실패를 놓치지 않으려는 것이라 이 한 줄에만 적용한다.
          (set -o pipefail; npm run test:cov --prefix apps/api | tee "$RUNNER_TEMP/api-unit-cov.txt")
          npm run test:postgres --prefix apps/api
          node --test tests/ops/verify_web_auth_rollback_test.mjs
          npm run typecheck --prefix apps/api
          npm run build --prefix apps/api
          npm run audit:ci --prefix apps/api
          npm run test:postgres --prefix apps/worker
          npm test --prefix apps/worker
          npm run typecheck --prefix apps/worker
          npm run build --prefix apps/worker
          npm run audit:ci --prefix apps/worker
      - name: API 단위 시험 커버리지 요약
        if: always()
        run: |
          {
            echo '### API 단위 시험 커버리지 (보고용, 기준선 없음)'
            echo 'PostgreSQL 통합 시험은 포함하지 않는다.'
            echo '```'
            if [ -f "$RUNNER_TEMP/api-unit-cov.txt" ]; then
              grep -E '(^|[[:space:]])(file|all files)[[:space:]]+\|' "$RUNNER_TEMP/api-unit-cov.txt" || echo '커버리지 줄을 찾지 못했습니다'
            else
              echo '커버리지 출력이 없습니다(앞 단계가 시험 전에 멈췄습니다)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: DB 백업·복원 드릴 시험
        env:
          DRILL_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          PGPASSWORD: postgres
          # 드릴이 쓰는 psql·pg_dump·pg_restore는 서비스 컨테이너 안(서버와 같은 16.10)의 것을 쓴다.
          PG_EXEC: docker exec -i -e PGPASSWORD ${{ job.services.postgres.id }}
        run: bash tests/ops/db_restore_drill_test.sh
      - name: Worker 로컬 Anvil 전체 흐름
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          PGPASSWORD: postgres
          ANVIL_RPC_URL: http://127.0.0.1:8545
        run: |
          ./scripts/anvil.sh --chain-id 31337 --silent > /tmp/masscom-anvil.log 2>&1 &
          anvil_pid=$!
          trap 'kill "$anvil_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail \
              --header 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:anvil --prefix apps/worker
      - name: 시연 호스트 전용 PostgreSQL 격리·복원 시험
        run: |
          bash tests/ops/showcase_host_readiness_test.sh
          bash tests/ops/run_showcase_host_postgres.sh
      - name: 앱 테스트·정적검사·운영/시연/웹 번들
        run: |
          npm test --prefix apps/mobile
          npm run typecheck --prefix apps/mobile
          npm run lint --prefix apps/mobile
          CI=1 EXPO_NO_DOTENV=1 APP_VARIANT=production \
            MASSCOM_BUILD_SOURCE_COMMIT="$GITHUB_SHA" EXPO_PUBLIC_API_URL=https://api.masscom.kr \
            npm run export:android --prefix apps/mobile -- --output-dir dist/production
          CI=1 EXPO_NO_DOTENV=1 APP_VARIANT=showcase \
            MASSCOM_BUILD_SOURCE_COMMIT="$GITHUB_SHA" \
            MASSCOM_SHOWCASE_GOOGLE_WEB_CLIENT_ID=123-ci.apps.googleusercontent.com \
            EXPO_PUBLIC_API_URL=https://demo-api.masscom.kr \
            npm run export:android --prefix apps/mobile -- --output-dir dist/showcase
          node scripts/verify-mobile-variant-assets.mjs
          CI=1 EXPO_NO_DOTENV=1 \
            MASSCOM_BUILD_SOURCE_COMMIT="$GITHUB_SHA" \
            MASSCOM_SHOWCASE_GOOGLE_WEB_CLIENT_ID=123-ci.apps.googleusercontent.com \
            npm run export:web:showcase --prefix apps/mobile -- --output-dir dist/showcase-web
          # 웹 첫 화면 대기 안내(apps/mobile/public/index.html)가 내보낸 index.html에 실제로 들어갔는지(없으면 번들이 내려오는 동안 흰 화면).
          grep -q 'class="boot"' apps/mobile/dist/showcase-web/index.html
          # 웹 번들에 지갑 SDK·ethers가 들어오지 않았는지(웹 자리 채움 .web 파일과 metro.config.js 리다이렉트가 빠지면 번들이 약 2.2 MB 커진다).
          # `! grep`은 bash -e에서 단계를 실패시키지 못하므로 if로 쓴다. 폴더가 없으면 grep이 오류(2)로 끝나 if가 조용히 통과하므로 먼저 폴더를 확인한다.
          test -d apps/mobile/dist/showcase-web/_expo/static/js/web || { echo '웹 번들 폴더가 없습니다' >&2; exit 1; }
          if grep -rlE 'walletconnect|@reown|ethers/' apps/mobile/dist/showcase-web/_expo/static/js/web; then
            echo '웹 번들에 지갑 SDK(walletconnect·@reown·ethers)가 들어 있습니다. .web 자리 채움 파일과 metro.config.js 리다이렉트를 확인하세요.' >&2
            exit 1
          fi
          npm run audit:ci --prefix apps/mobile
