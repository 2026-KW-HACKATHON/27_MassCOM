name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:650d7a867dc5336eff67802a1417fcc801821d73d824c608e80afbde792fe6e1
        env:
          POSTGRES_DB: masscom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d masscom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/mobile/package-lock.json
            apps/worker/package-lock.json
      - name: 저장소 비밀값 검사
        run: |
          bash scripts/check-secrets.sh
          bash tests/bootstrap/check_secrets_test.sh
          bash scripts/check-privacy.sh
          bash tests/bootstrap/check_privacy_test.sh
      - name: PR 한국어 작성 확인
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-pr-korean.sh "$PR_TITLE" "$PR_BODY"
      - name: Verify repository contract
        run: bash tests/bootstrap/verify_bootstrap_test.sh
      - name: Verify project portal
        run: bash tests/site/check_site_accessibility_test.sh
      - name: Verify project portal structure
        run: bash tests/site/verify_project_site_test.sh
      - name: Verify presentation and submission evidence
        run: bash tests/site/verify_presentation_test.sh
      - name: NFT 계약 포맷·빌드·테스트
        run: |
          ./scripts/forge.sh --version | grep -q 'forge Version: 1.8.3'
          ./scripts/forge.sh fmt --check
          ./scripts/forge.sh build
          ./scripts/forge.sh test -vvv
          ./scripts/forge.sh lint
      - name: 앱·API 의존성 설치
        run: |
          npm ci --prefix apps/api
          npm ci --prefix apps/mobile
          npm ci --prefix apps/worker
      - name: API·PostgreSQL 테스트·타입검사·빌드
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          PGPASSWORD: postgres
        run: |
          npm run db:migrate --prefix apps/api
          npm test --prefix apps/api
          npm run test:postgres --prefix apps/api
          npm run typecheck --prefix apps/api
          npm run build --prefix apps/api
          npm run audit:ci --prefix apps/api
          npm run test:postgres --prefix apps/worker
          npm test --prefix apps/worker
          npm run typecheck --prefix apps/worker
          npm run build --prefix apps/worker
          npm run audit:ci --prefix apps/worker
      - name: Worker 로컬 Anvil 전체 흐름
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/masscom_test
          PGPASSWORD: postgres
          ANVIL_RPC_URL: http://127.0.0.1:8545
        run: |
          ./scripts/anvil.sh --chain-id 31337 --silent > /tmp/masscom-anvil.log 2>&1 &
          anvil_pid=$!
          trap 'kill "$anvil_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail \
              --header 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:anvil --prefix apps/worker
      - name: Android 앱 테스트·정적검사·번들
        run: |
          npm test --prefix apps/mobile
          npm run typecheck --prefix apps/mobile
          npm run lint --prefix apps/mobile
          npm run export:android --prefix apps/mobile
          npm run audit:ci --prefix apps/mobile
