<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="월계 마스코트 운영 서비스의 공개 음식점 목록과 웹 도감 이용 안내">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <title>월계 마스코트 · 음식점 찾기</title>
    <link rel="stylesheet" href="assets/production.css">
    <script type="module" src="assets/production.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header">
      <p class="brand"><span class="brand-mark" aria-hidden="true">月</span> 월계 마스코트</p>
      <nav aria-label="페이지 이동">
        <a href="#merchants">음식점 찾기</a>
        <a href="#collection">내 도감</a>
      </nav>
    </header>

    <main id="main">
      <section class="intro" aria-labelledby="intro-title">
        <p class="context">월계1동 음식점 탐색</p>
        <h1 id="intro-title">동네의 가게를<br>살펴보세요.</h1>
        <p class="intro-body">현재 공개 중인 음식점 정보를 확인할 수 있습니다. 가게 정보는 운영 서비스에서 직접 불러옵니다.</p>
      </section>

      <section class="merchant-section" id="merchants" aria-labelledby="merchants-title">
        <div class="section-heading">
          <h2 id="merchants-title">음식점</h2>
          <p>운영 중인 공개 목록</p>
        </div>
        <p id="merchant-status" class="status" role="status" aria-live="polite">음식점 목록을 불러오는 중입니다.</p>
        <div id="merchant-list" class="merchant-list" aria-label="공개 음식점 목록"></div>
      </section>

      <section class="collection-section" id="collection" aria-labelledby="collection-title">
        <div>
          <p class="context">개인 정보 보호</p>
          <h2 id="collection-title">내 도감</h2>
        </div>
        <p class="collection-message">웹 로그인과 안전한 개인 세션이 준비되면 본인의 도감을 여기서 볼 수 있습니다. 현재 웹 도감은 이용할 수 없습니다.</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>월계 마스코트 운영 서비스 · 이 페이지는 공개 음식점 정보만 표시합니다.</p>
    </footer>
  </body>
</html>
