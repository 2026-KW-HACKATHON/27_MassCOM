<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>MassCOM 관리자</title>
  <link rel="stylesheet" href="/app/assets/production.css">
  <script type="module" src="/admin/assets/admin.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <main id="main">
    <h1>MassCOM 관리자</h1>
    <p id="admin-status" role="status" aria-live="polite">권한을 확인하는 중입니다.</p>
    <a id="admin-login" href="/api/web/admin/auth/start" hidden>Google 계정으로 로그인</a>
    <button id="admin-logout" type="button" hidden>로그아웃</button>
    <section id="admin-content" hidden>
      <h2>실제 상점</h2>
      <p>새 상점은 비공개로 저장됩니다. 비공개 및 신규 참여 중지는 활성 캠페인도 일시 중지합니다.</p>
      <form id="admin-create">
        <h3>상점 추가</h3>
        <label>상점 이름 <input name="name" required maxlength="200"></label>
        <label>소개 <textarea name="story" maxlength="4000"></textarea></label>
        <label>도로명 주소 <input name="roadAddress" required maxlength="500"></label>
        <label>최소 결제 금액(원) <input name="minimumSpendWon" type="number" min="0" max="1000000000" step="1" required></label>
        <button type="submit">비공개로 저장</button>
      </form>
      <div id="admin-merchants"></div>
    </section>
  </main>
</body>
</html>
